name: manuals-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emacs and Texinfo
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox texinfo

      - name: Run test suite
        run: |
          scripts/run-tests.sh

      - name: Byte-compile with warnings as errors
        run: |
          emacs -Q --batch -L . \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile looking-glass.el looking-glass-regex.el

      - name: Checkdoc
        run: |
          output="$(emacs -Q --batch --eval \
            '(progn (require (quote checkdoc))
                    (setq checkdoc-diagnostic-buffer "*warn*")
                    (dolist (f (list "looking-glass.el" "looking-glass-regex.el"))
                      (checkdoc-file f))
                    (with-current-buffer "*warn*" (princ (buffer-string))))' 2>&1)"
          echo "$output"
          ! echo "$output" | grep -q ':[0-9]'

      - name: Build manuals from org
        run: |
          scripts/build-manuals.sh

      - name: Upload built manuals artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-manuals
          path: build/manuals/info
